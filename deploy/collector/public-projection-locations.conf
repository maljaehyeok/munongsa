# HTTPS server-block template. Replace __BACKEND__ with the existing verified
# chat bridge address; preserve all existing TLS/chat/timer settings.
# HTTP context also needs:
# limit_req_zone $binary_remote_addr zone=munongsa_public_rate:1m rate=5r/s;
location = /assets/support-details.json {
    if ($request_method != GET) { return 405; }
    limit_req zone=munongsa_public_rate burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://__BACKEND__/api/public-support/details;
    proxy_set_header Host munongsa.duckdns.org;
    proxy_set_header Origin "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
    proxy_cache off;
    access_log off;
    add_header Cache-Control "no-store" always;
}
location = /data/support-review.json {
    if ($request_method != GET) { return 405; }
    limit_req zone=munongsa_public_rate burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://__BACKEND__/api/public-support/review;
    proxy_set_header Host munongsa.duckdns.org;
    proxy_set_header Origin "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
    proxy_cache off;
    access_log off;
    add_header Cache-Control "no-store" always;
}
