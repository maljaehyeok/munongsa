server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The container sees only human-approved output, never SQLite or credentials.
    location = /data/support-public.json {
        alias /srv/munongsa-public/support-public.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ =404; }
}
